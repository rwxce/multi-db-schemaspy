<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Databases by Server</title>
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon.png">

    <link rel="stylesheet" href="./bower/admin-lte/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="./bower/font-awesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="./bower/ionicons/css/ionicons.min.css">
    <link rel="stylesheet" href="./bower/datatables.net-bs/css/dataTables.bootstrap.min.css">
    <link rel="stylesheet" href="./bower/datatables.net-buttons-bs/css/buttons.bootstrap.min.css">
    <link rel="stylesheet" href="./bower/codemirror/codemirror.css">
    <link href="./fonts/indieflower/indie-flower.css" rel="stylesheet" type="text/css">
    <link href="./fonts/source-sans-pro/source-sans-pro.css" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="./bower/admin-lte/dist/css/AdminLTE.min.css">
    <link rel="stylesheet" href="./bower/salvattore/salvattore.css">
    <link rel="stylesheet" href="./bower/admin-lte/dist/css/skins/_all-skins.min.css">
    <link rel="stylesheet" href="./schemaSpy.css">
  </head>

  <body class="hold-transition skin-blue layout-top-nav">
    <div class="wrapper">
      <div class="content-wrapper">
        <section class="content-header">
          <div class="callout callout-info">
            <h4>SchemaSpy - Databases by Server</h4>
            <p>Select a server to list all its internal databases.</p>
          </div>
        </section>

        <section class="content">
          <div id="status-message" class="alert alert-danger" style="display:none;"></div>

          <div class="box box-primary">
            <div class="box-header with-border">
              <h3 class="box-title">Server Selector</h3>
              <span class="label label-primary pull-right"><i class="fa fa-server fa-2x"></i></span>
            </div>
            <div class="box-body">
              <div class="form-group">
                <label for="server-selector">Server</label>
                <select id="server-selector" class="form-control"></select>
              </div>
            </div>
          </div>

          <div class="box box-primary">
            <div class="box-header with-border">
              <h3 class="box-title">Available Databases</h3>
            </div>
            <div class="box-body">
              <table class="table table-bordered table-striped dataTable" role="grid">
                <thead>
                  <tr>
                    <th>Database</th>
                    <th>Description</th>
                  </tr>
                </thead>
                <tbody id="database-table-body"></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>

      <footer class="main-footer">
        <div>
          <div class="pull-right hidden-xs">
            <a href="https://github.com/schemaspy/schemaspy" title="GitHub for SchemaSpy"><i class="fa fa-github-square fa-2x"></i></a>
            <a href="http://stackoverflow.com/questions/tagged/schemaspy" title="StackOverflow for SchemaSpy"><i class="fa fa-stack-overflow fa-2x"></i></a>
          </div>
          <strong>Generated by <a href="http://schemaspy.org/" class="logo-text"><i class="fa fa-database"></i> SchemaSpy 7.0.2</a></strong>
        </div>
      </footer>
    </div>

    <script src="./data/catalog.data.js"></script>
    <script src="./catalog.js"></script>
  </body>
</html>
